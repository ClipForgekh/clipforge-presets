<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipForge Presets Hub - Interactive Catalog</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b23;
      --card-border: #282d3d;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --vip: #f59e0b;
      --tag-bg: #222738;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    header { max-width: 1300px; margin: 0 auto 24px; }
    h1 { font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .badge-count { background: var(--accent); color: #fff; font-size: 14px; padding: 2px 10px; border-radius: 999px; }
    p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
    
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; align-items: center; }
    .search-box {
      flex: 1; min-width: 280px; padding: 10px 16px; border-radius: 8px;
      border: 1px solid var(--card-border); background: var(--card-bg); color: #fff; font-size: 14px;
    }
    .search-box:focus { outline: none; border-color: var(--accent); }
    
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn {
      background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted);
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s ease;
    }
    .tab-btn:hover { border-color: var(--accent); color: #fff; }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; max-width: 1300px; margin: 0 auto;
    }
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px;
      overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .thumb-wrapper {
      position: relative; width: 100%; padding-top: 56.25%; background: #000; overflow: hidden;
    }
    .thumb-img {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;
    }
    .thumb-badge {
      position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7);
      padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600;
    }
    .thumb-badge.vip { background: var(--vip); color: #000; }
    .thumb-badge.free { background: #10b981; color: #fff; }
    
    .card-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
    .card-tag { background: var(--tag-bg); padding: 2px 6px; border-radius: 4px; }
    
    .card-actions { margin-top: auto; display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--card-border);
      background: #202434; color: #fff; font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--accent); border-color: var(--accent); }
    .btn-secondary { background: transparent; }
    
    .pagination {
      max-width: 1300px; margin: 32px auto 16px; display: flex; justify-content: center; align-items: center; gap: 12px;
    }
    .page-info { color: var(--text-muted); font-size: 13px; }
    
    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #10b981; color: #fff; padding: 10px 18px;
      border-radius: 8px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>ClipForge Presets Hub <span class="badge-count" id="totalCount">2,732</span></h1>
    <p class="subtitle">Search, preview, and copy Raw GitHub & CDN URLs for color filters, text templates, video effects, and velocity curves.</p>
    
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Search presets by name, category, or ID...">
      <div class="tabs" id="tabs">
        <button class="tab-btn active" data-cat="all">All</button>
        <button class="tab-btn" data-cat="filters">Filters</button>
        <button class="tab-btn" data-cat="text-templates">Text Templates</button>
        <button class="tab-btn" data-cat="velocity-curves">Velocity Curves</button>
        <button class="tab-btn" data-cat="video-effects">Video Effects</button>
        <button class="tab-btn" data-cat="voice-effects">Voice Effects</button>
        <button class="tab-btn" data-cat="stickers-overlays">Stickers</button>
        <button class="tab-btn" data-cat="beauty-retouch">Beauty</button>
        <button class="tab-btn" data-cat="ai-styles">AI Styles</button>
      </div>
    </div>
  </header>

  <main class="grid" id="presetGrid"></main>

  <div class="pagination">
    <button class="btn" id="prevBtn" style="flex: initial; width: 100px;">Previous</button>
    <span class="page-info" id="pageInfo">Page 1 of 1</span>
    <button class="btn" id="nextBtn" style="flex: initial; width: 100px;">Next</button>
  </div>

  <div class="toast" id="toast">Copied Raw CDN URL to clipboard!</div>

  <script>
    const REPO = "ClipForgekh/clipforge-presets";
    let allPresets = [];
    let filteredPresets = [];
    let currentPage = 1;
    const PAGE_SIZE = 48;
    let currentCategory = "all";
    let searchQuery = "";

    async function loadCatalog() {
      try {
        const res = await fetch("catalog.json");
        const data = await res.json();
        allPresets = data.presets || [];
        document.getElementById("totalCount").textContent = allPresets.length.toLocaleString();
        applyFilter();
      } catch (e) {
        console.error("Failed to load catalog.json:", e);
      }
    }

    function applyFilter() {
      filteredPresets = allPresets.filter(p => {
        const matchesCat = currentCategory === "all" || p.branch === currentCategory;
        const matchesQuery = !searchQuery || 
          p.title.toLowerCase().includes(searchQuery) ||
          p.id.includes(searchQuery) ||
          (p.category && p.category.toLowerCase().includes(searchQuery));
        return matchesCat && matchesQuery;
      });
      currentPage = 1;
      render();
    }

    function render() {
      const grid = document.getElementById("presetGrid");
      grid.innerHTML = "";
      
      const totalPages = Math.ceil(filteredPresets.length / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const pageItems = filteredPresets.slice(start, start + PAGE_SIZE);

      document.getElementById("pageInfo").textContent = `Page ${currentPage} of ${totalPages} (${filteredPresets.length.toLocaleString()} items)`;
      document.getElementById("prevBtn").disabled = currentPage <= 1;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages;

      pageItems.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        
        const cover = p.cover || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&q=80";
        const isVip = p.is_vip;
        const branch = p.branch || "main";
        const cdnUrl = `https://cdn.jsdelivr.net/gh/${REPO}@${branch}/${branch}/`;
        
        card.innerHTML = `
          <div class="thumb-wrapper">
            <img class="thumb-img" src="${cover}" alt="${p.title}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'100\\' height=\\'100\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23181b23\\'/></svg>'">
            <span class="thumb-badge ${isVip ? 'vip' : 'free'}">${isVip ? 'VIP' : 'FREE'}</span>
          </div>
          <div class="card-body">
            <div class="card-title" title="${p.title}">${p.title}</div>
            <div class="card-meta">
              <span class="card-tag">${p.category || 'Preset'}</span>
              <span>ID: ${p.id.slice(-6)}</span>
            </div>
            <div class="card-actions">
              <button class="btn btn-secondary" onclick="copyRawUrl('${branch}', '${p.id}', '${p.title}')">Copy Raw</button>
              <a class="btn" href="${p.url}" target="_blank" rel="noopener" download>Download</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2000);
    }

    window.copyRawUrl = function(branch, id, title) {
      const rawUrl = `https://raw.githubusercontent.com/${REPO}/${branch}/README.md`;
      navigator.clipboard.writeText(rawUrl).then(() => {
        showToast(`Copied ${branch} branch link!`);
      });
    };

    // Event Listeners
    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      applyFilter();
    });

    document.getElementById("tabs").addEventListener("click", (e) => {
      if (e.target.classList.contains("tab-btn")) {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentCategory = e.target.dataset.cat;
        applyFilter();
      }
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      const totalPages = Math.ceil(filteredPresets.length / PAGE_SIZE);
      if (currentPage < totalPages) { currentPage++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });

    loadCatalog();
  </script>
</body>
</html>
